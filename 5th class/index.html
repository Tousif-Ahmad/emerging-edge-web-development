<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms part 2</title>
</head>
<body>
    <form>
        <label for="gender">Select your Gender:</label> <br>
        <input type="radio" name="gender" value="Male">Male
        <input type="radio" name="gender" value="Female">Female
        <input type="radio" name="gender" value="Others">Others

        <br> <br> <br>
        <label for="">Select Your favrt fruits:</label> <br>
        <input type="checkbox" name="fav-fruits" value="Apple">Apple
        <input type="checkbox" name="fav-fruits" value="Banana">Banana
        <input type="checkbox" name="fav-fruits" value="Apricot">Apricot
        <input type="checkbox" name="fav-fruits" value="Guava">Guava

        <br> <br>

        <label for="">Select Your Country:</label>
        <select name="country" id="">
            <option value="Pakistan">Pakistan</option>
            <option value="India">India</option>
            <option value="USA">USA</option>
            <option value="UK">UK</option>
        </select>

        <br> <br>

        <label for="cv">Upload your cv:</label> <br>
        <input type="file" name="cv" accept=".pdf">

        <!-- validation -->
         


        <br> <br>
        <input type="submit">
    </form>
</body>
</html>

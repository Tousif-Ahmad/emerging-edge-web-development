<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 3</title>
</head>
<body>
    <h1>Student Registration Form</h1>
    <form>
        <label for="username">Name:</label>
        <input type="text" id="username" placeholder="Enter your name" name="username" required>
        <br> <br>
        <label for="fName">Father Name:</label>
        <input type="text" id="FName" name="Father-Name" placeholder="Enter your Father Name" required>
        <br> <br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Enter your email">
        <br> <br>
        <label for="telNum">Phone Number:</label>
        <input type="tel" id="telNum" name="Phone-Number" placeholder="Enter your phone number">
        <br> <br>
        <label for="DOB">DOB:</label>
        <input type="date" name="DOB" id="DOB" placeholder="Enter your date of birth">
        <br> <br>
        <label for="age">Age</label>
        <input type="number" id="age" name="age" placeholder="Enter your age">
        <br> <br>

        <label for="gender">Select Your gender:</label>
        <input type="radio" name="gender" value="Male">Male
        <input type="radio" name="gender" value="Female">Female
        <input type="radio" name="gender" value="Other">Other
        <br> <br>

        <label for="city">Select Your City:</label>
        <select name="city" id="city">
            <option value="Peshawar">Peshawar</option>
            <option value="Lahore">Lahore</option>
            <option value="Karachi">Karachi</option>
            <option value="Quetta">Quetta</option>
        </select>

        <br> <br>

        <label for="skils">Mark your skills:</label>
        <input type="checkbox" id="skills" name="skils" value="HTML">HTML
        <input type="checkbox" id="skills" name="skils" value="CSS">CSS
        <input type="checkbox" id="skills" name="skils" value="Javascript">Javascript
        <input type="checkbox" id="skills" name="skils" value="Python">Python

        <br> <br>
        <label for="profile-Pic">Upload your Picture:</label>
        <input type="file" id="profile-Pic" name="profile-Pic">

        <br> <br>

        <label for="password">Password:</label>
        <input type="password" name="password" id="password" placeholder="password">
        <br> <br>
        <label for="confirm-password">Confirm Password:</label>
        <input type="password" name="confirm-password" id="confirm-password" placeholder="confirm-password">
        <br> <br>

        <label for="course">Select Your Course:</label>
        <select name="course" id="course">
            <option value="Web Development">Web Development</option>
            <option value="App Development">App Development</option>
            <option value="Graphic Designing">Graphic Designing</option>
            <option value="Video Editing">Video Editing</option>
            <option value="Artificial Intelligence">Artificial Intelligence</option>
        </select>
        <br> <br>

        <input type="checkbox" id="terms" name="terms">
        <label for="terms">I agree to terms and conditions</label>
        
        <br> <br>

        <input type="submit">
        <input type="reset">
        

    </form>
</body>
</html>
